<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniConnect — Protótipo Interativo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{--brand:#E8600A;--brand2:#C44D06;--bl:#FEF0E6;--bm:#FDD5B5;--bg-primary:#fff;--bg-secondary:#F7F7F5;--bg-tertiary:#F0EEE8;--text-primary:#1A1A1A;--text-secondary:#666;--border:#E5E3DC;--border2:#D0CEC6;--radius:10px;--radius-sm:6px}
@media(prefers-color-scheme:dark){:root{--bg-primary:#1C1C1E;--bg-secondary:#2C2C2E;--bg-tertiary:#3A3A3C;--text-primary:#F2F2F7;--text-secondary:#8E8E93;--border:#3A3A3C;--border2:#48484A}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-tertiary);color:var(--text-primary);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;padding:16px}
.device{width:390px;background:var(--bg-primary);border-radius:40px;box-shadow:0 24px 80px rgba(0,0,0,.18);overflow:hidden;border:1px solid var(--border)}
.status-bar{background:var(--bg-primary);padding:12px 24px 4px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}
.topbar{display:flex;align-items:center;gap:8px;padding:0 14px;height:48px;border-bottom:0.5px solid var(--border);background:var(--bg-primary)}
.logo{font-size:17px;font-weight:700;flex-shrink:0}.logo span{color:var(--brand)}
.bc-wrap{display:flex;align-items:center;gap:3px;flex:1;overflow:hidden;min-width:0}
.bc{font-size:11px;color:var(--text-secondary);padding:2px 5px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap}
.bc:hover{background:var(--bg-secondary)}
.bc.cur{color:var(--text-primary);font-weight:600;cursor:default}
.bc-sep{font-size:11px;color:var(--text-secondary)}
.back-btn{display:flex;align-items:center;gap:3px;padding:5px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);cursor:pointer;background:transparent;flex-shrink:0}
.back-btn:hover{background:var(--bg-secondary)}
.back-btn:disabled{opacity:.3;cursor:not-allowed}
.main{background:var(--bg-secondary);min-height:560px;overflow-y:auto;max-height:600px}
.scr{padding:16px}
.nav-bottom{display:flex;border-top:0.5px solid var(--border);background:var(--bg-primary);padding-bottom:env(safe-area-inset-bottom,0)}
.nbi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px;cursor:pointer;font-size:10px;color:var(--text-secondary);gap:2px;border:none;background:transparent}
.nbi.on,.nbi:hover{color:var(--brand)}
.nbi i{font-size:20px}
.card{background:var(--bg-primary);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.bo{background:var(--bl);color:var(--brand2)}
.bb{background:#E6F1FB;color:#0C447C}
.bp{background:#EEEDFE;color:#3C3489}
.bt{background:#E1F5EE;color:#085041}
.ba{background:#FAEEDA;color:#633806}
.bg{background:#EAF3DE;color:#27500A}
.bgy{background:#F1EFE8;color:#444441}
.br{background:#FCEBEB;color:#791F1F}
.btn{padding:7px 14px;font-size:12px;font-weight:600;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:transparent;color:var(--text-primary);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg-secondary)}
.btnp{background:var(--brand);color:#fff;border-color:var(--brand)}
.btnp:hover{background:var(--brand2)}
.btno{border-color:var(--brand);color:var(--brand)}
.btno:hover{background:var(--bl)}
.ptitle{font-size:17px;font-weight:700;margin-bottom:3px}
.psub{font-size:12px;color:var(--text-secondary);margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;padding:11px 6px;background:var(--bg-secondary);border-radius:var(--radius-sm)}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:11px;color:var(--text-secondary);margin-top:2px}
.divrow{padding:9px 0;border-bottom:0.5px solid var(--border)}
.divrow:last-child{border-bottom:none}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:0.5px solid var(--border2);color:var(--text-secondary)}
.tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:12px;padding:7px 12px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap;flex-shrink:0}
.tab.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
.msg-wrap{display:flex;flex-direction:column;max-height:230px;overflow-y:auto;gap:4px;margin-bottom:8px}
.msg{max-width:85%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.5}
.mu{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
.mai{align-self:flex-start;background:var(--bg-primary);border:0.5px solid var(--border);border-bottom-left-radius:3px}
.msw{font-size:10px;font-weight:600;margin-bottom:2px;color:var(--text-secondary)}
.ci{display:flex;gap:7px}
.ci input{flex:1;padding:9px 12px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg-primary);color:var(--text-primary)}
.mat-card{display:flex;align-items:center;gap:10px;padding:11px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg-primary);cursor:pointer;margin-bottom:8px;transition:border-color .15s}
.mat-card:hover{border-color:var(--brand)}
.mat-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prog-bar{height:5px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:3px;background:var(--brand)}
.sala-msg{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.sala-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.sala-bubble{background:var(--bg-primary);border:0.5px solid var(--border);border-radius:8px;border-top-left-radius:2px;padding:7px 10px;font-size:12px;line-height:1.5;max-width:82%}
.sala-name{font-size:10px;font-weight:600;color:var(--text-secondary);margin-bottom:2px}
.livro{display:flex;align-items:flex-start;gap:10px;padding:11px;border:0.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-primary);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.livro:hover{border-color:var(--brand)}
.livro-capa{width:36px;height:48px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.streak{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.streak-day{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.plug{display:flex;align-items:center;gap:10px;padding:12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg-primary);cursor:pointer;margin-bottom:8px;transition:border-color .15s}
.plug:hover{border-color:var(--brand)}
.plug.sel{border:2px solid var(--brand)}
.pi{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.prog-sync{height:4px;background:var(--bg-secondary);border-radius:2px;overflow:hidden;margin:8px 0}
.pf{height:100%;border-radius:2px;background:var(--brand);transition:width .5s ease}
.sync-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.sync-item:last-child{border-bottom:none}
.sic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.plan-card{border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--bg-primary);margin-bottom:10px}
.plan-card.featured{border:2px solid var(--brand)}
.notif-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
.toggle{width:38px;height:22px;border-radius:11px;background:var(--bg-secondary);border:0.5px solid var(--border2);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--brand);border-color:var(--brand)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:18px}
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:560px;padding:20px;background:var(--bg-secondary)}
.login-card{background:var(--bg-primary);border:0.5px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:320px}
.pfbtn{display:flex;align-items:center;gap:12px;padding:14px;border:0.5px solid var(--border);border-radius:var(--radius);cursor:pointer;margin-bottom:10px;background:var(--bg-primary);transition:border-color .15s}
.pfbtn:hover{border-color:var(--brand);background:var(--bl)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.inp{width:100%;padding:9px 12px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg-primary);color:var(--text-primary);margin-bottom:10px}
.lbl{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block}
.intro-bar{background:var(--brand);padding:10px 16px;text-align:center;font-size:12px;color:#fff;font-weight:500}
</style>
</head>
<body>
<div style="max-width:420px;width:100%;text-align:center;margin-bottom:12px">
  <div style="font-size:22px;font-weight:700;color:var(--brand)">UniConnect</div>

</div>
<div class="device">

  <div class="status-bar">
    <span>9:41</span>
    <span>UniConnect</span>

  </div>
  <div id="root"></div>
</div>
<div style="margin-top:16px;font-size:11px;color:#888;text-align:center">
  Use os menus de navegação abaixo de cada tela<br>
  Botão "Voltar" no topo para navegar no histórico
</div>

<script>
const HIST=[];
let S={
  screen:'login',perfil:null,tab:'home',etab:'Chat IA',etabe:'dashboard',
  materia:null,etabMat:'hub',salaAtiva:'calc2',simConfig:{materia:'calc2',tema:'Integrais',qtd:3,tipo:'Multipla'},
  simGlobal:false,simFeito2:false,simRespostas2:{},simResultado2:null,
  chatMsgs:[{ai:true,text:'Olá! Sou o Professor Virtual. Conectei à sua grade de Ciência da Computação — 6º semestre, UFPR. Pergunte qualquer coisa sobre suas matérias!'}],
  salaMsgs:{
    calc2:[{av:'MA',bg:'#E1F5EE',c:'#085041',n:'Maria Alves (USP)',txt:'Alguém sabe como resolver a integral dupla em coordenadas polares?'},{av:'PC',bg:'#E6F1FB',c:'#0C447C',n:'Pedro Costa (UNICAMP)',txt:'Converta usando x=r·cos(θ) e y=r·sen(θ). O jacobiano vira r, então dA = r·dr·dθ.'},{av:'LF',bg:'#FAEEDA',c:'#633806',n:'Lara Fonseca (UFPR)',txt:'Tem um vídeo ótimo do MIT OpenCourseWare sobre isso!'}],
    ed:[{av:'RF',bg:'#FCEBEB',c:'#791F1F',n:'Rafael Ferreira (USP)',txt:'Qual a diferença entre Pilha e Fila na prática?'},{av:'JS',bg:'#FEF0E6',c:'#C44D06',n:'João (você)',txt:'Pilha é LIFO — último a entrar, primeiro a sair. Fila é FIFO.'},{av:'PC',bg:'#E6F1FB',c:'#0C447C',n:'Pedro Costa (UNICAMP)',txt:'Exato! Pensa na pilha como pratos e fila como banco.'}],
    bd:[{av:'AN',bg:'#EAF3DE',c:'#27500A',n:'Ana Neves (UFRJ)',txt:'Diferença entre JOIN e LEFT JOIN?'},{av:'MA',bg:'#E1F5EE',c:'#085041',n:'Maria Alves (USP)',txt:'JOIN retorna só quem tem correspondência. LEFT JOIN retorna todos da esquerda.'}],
  },

  candidaturas:[],vagaIdx:null,candidatoIdx:null,plugStep:0,plugSel:'ufpr',syncProg:0,
  notifs:3,plano:'free',toggles:{email:true,vaga:true,prova:true,news:false},
  progresso:{simulados:12,acertos:78,streak:9},
};

const LABELS={login:'Login',cadastro:'Cadastro',plugin:'Conectar faculdade',planos:'Planos',
  home:'Home',vagas:'Vagas',estudos:'Estudos',grupos:'Grupos',perfil:'Perfil',notifs:'Notificações',config:'Config',
  dashboard:'Dashboard',vagasemp:'Vagas',candidatos:'Candidatos',busca:'Buscar',chatEmp:'Chat',
  vagadetalhe:'Vaga',candidatodetalhe:'Candidato',materia:'Matéria',
  grade:'Grade',ia:'Prof. Virtual',simulado:'Simulado',sala:'Sala virtual',progresso:'Progresso'};

function pushH(s,t){const l=HIST[HIST.length-1];if(l&&l.s===s&&l.t===t)return;HIST.push({s,t:t||null,perfil:S.perfil});}
function goBack(){if(HIST.length<2)return;HIST.pop();const p=HIST[HIST.length-1];S.screen=p.s;if(p.t)S.tab=p.t;if(p.perfil)S.perfil=p.perfil;render();}
function nav(s,t){pushH(s,t||null);S.screen=s;if(t)S.tab=t;render();}
function navTab(t){S.tab=t;nav('app',t);}
function jumpH(i){const t=HIST[i];while(HIST.length>i+1)HIST.pop();S.screen=t.s;if(t.t)S.tab=t.t;if(t.perfil)S.perfil=t.perfil;render();}

function buildBC(){
  if(HIST.length<2)return'';
  return HIST.slice(-4).map((h,i,arr)=>{
    const isLast=i===arr.length-1;
    const key=h.s==='app'?(h.t||'home'):h.s==='materia'?(h.t||'grade'):h.s;
    const lbl=LABELS[key]||key;
    const realIdx=HIST.length-arr.length+i;
    if(isLast)return`<span class="bc cur">${lbl}</span>`;
    return`<span class="bc" onclick="jumpH(${realIdx})">${lbl}</span><span class="bc-sep">›</span>`;
  }).join('');
}

function topbar(){
  const canBack=HIST.length>=2;
  const bc=buildBC();
  const hasNotif=S.notifs>0;
  return`<div class="topbar">
    <div class="logo">Uni<span>Connect</span></div>
    <div class="bc-wrap">${bc||`<span class="bc cur">${LABELS[S.screen]||'App'}</span>`}</div>
    <div style="display:flex;align-items:center;gap:6px">
      ${S.perfil?`<div style="position:relative;cursor:pointer" onclick="navTab('notifs')"><i class="ti ti-bell" style="font-size:18px;color:var(--text-secondary)"></i>${hasNotif?`<div style="width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;position:absolute;top:-4px;right:-5px">${S.notifs}</div>`:''}</div>`:''}
      <button class="back-btn" onclick="goBack()" ${canBack?'':'disabled'}><i class="ti ti-arrow-left"></i> Voltar</button>
    </div>
  </div>`;}

function render(){
  const el=document.getElementById('root');
  el.innerHTML=build();
  // scroll to top on navigation
  const main=el.querySelector('.main');
  if(main)main.scrollTop=0;
}

const MATERIAS=[

  {id:'ed',nome:'Estrutura de Dados',sem:6,prof:'Prof. André Costa',alunos:198,icon:'🌲',cor:'#E1F5EE',tc:'#085041',status:'cursando',prog:75,tags:['Árvores','Grafos','Hash']},

  {id:'so',nome:'Sistemas Operacionais',sem:6,prof:'Prof. Paulo Ramos',alunos:187,icon:'⚙️',cor:'#FEF0E6',tc:'#C44D06',status:'cursando',prog:30,tags:['Processos','Memória','I/O']},
  {id:'ia',nome:'Introdução à IA',sem:6,prof:'Prof. Beatriz Souza',alunos:156,icon:'🤖',cor:'#EAF3DE',tc:'#27500A',status:'cursando',prog:20,tags:['ML','Redes Neurais','NLP']},
  {id:'alg',nome:'Algoritmos Avançados',sem:5,prof:'Prof. Fernando Melo',alunos:143,icon:'🔢',cor:'#FAEEDA',tc:'#633806',status:'concluida',prog:100,tags:['Grafos','Complexidade','DP']},

    {tipo:'📄',titulo:'Complexidade e Análise',fonte:'PDF · UNICAMP',desc:'Apostila do prof. Tomás Kowaltowski. 80 páginas.'}],
  bd:[{tipo:'📘',titulo:'Sistemas de Banco de Dados — Elmasri',fonte:'OpenLibrary',desc:'Referência mundial em bancos relacionais e SQL.'},
    {tipo:'🎥',titulo:'SQL do zero ao avançado',fonte:'YouTube',desc:'Curso completo em português com projetos práticos.'},
    {tipo:'📄',titulo:'Normalização e Modelagem ER',fonte:'PDF · UFMG',desc:'Apostila com exemplos práticos de modelagem.'}],

    <div class="card"><div class="divrow row" style="cursor:pointer" onclick="S.screen='login';S.perfil=null;HIST.length=0;HIST.push({s:'login',t:null});render()"><div style="font-size:13px;color:var(--text-secondary)">Sair da conta</div><i class="ti ti-logout" style="color:var(--text-secondary)"></i></div></div>`;

  else if(S.tab==='vagasemp')c=`
    <div class="ptitle">Minhas vagas</div><div class="psub">Gerencie suas publicações</div>
    <button class="btn btnp" style="width:100%;margin-bottom:12px"><i class="ti ti-plus"></i> Criar nova vaga</button>
    ${[['Dev front-end júnior','Estágio · R$1.500/mês','12'],['Analista de dados','Emprego · R$3.800/mês','8'],['UX Designer Jr.','Estágio · R$1.200/mês','4']].map(([t,sub,cnt])=>`<div class="card"><div class="row"><div style="flex:1"><div style="display:flex;gap:5px;margin-bottom:4px"><span class="badge bt">Ativa</span><span class="badge bgy">${cnt} candidatos</span></div><div style="font-size:13px;font-weight:600">${t}</div><div style="font-size:12px;color:var(--text-secondary)">${sub}</div></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn" style="font-size:11px">Editar</button><button class="btn btno" style="font-size:11px" onclick="navTab('candidatos')">Candidatos</button></div></div></div>`).join('')}`;
  else if(S.tab==='candidatos')c=`
    <div class="ptitle">Candidatos</div><div class="psub">Dev front-end júnior · 12 candidatos</div>
    ${CANDS.map((cd,i)=>`<div class="card"><div style="display:flex;align-items:flex-start;gap:10px;cursor:pointer" onclick="abrirCandidato(${i})"><div class="av" style="width:38px;height:38px;font-size:13px;font-weight:700;background:${cd.bg};color:${cd.c}">${cd.ic}</div><div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><div style="font-size:13px;font-weight:600">${cd.n}</div><span class="badge ${cd.st}">${cd.lb}</span></div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">${cd.s}</div><div class="tags">${cd.sk.map(s=>`<span class="tag">${s}</span>`).join('')}</div></div></div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn" style="flex:1;font-size:11px" onclick="abrirCandidato(${i})">Ver perfil</button><button class="btn btnp" style="flex:1;font-size:11px"><i class="ti ti-message"></i> Chat</button></div></div>`).join('')}`;
  else if(S.tab==='busca')c=`
    <div class="ptitle">Buscar talentos</div><div class="psub">Encontre candidatos antes de abrir vagas</div>
    <input style="width:100%;padding:9px 12px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg-primary);color:var(--text-primary);margin-bottom:8px" placeholder="Nome, habilidade ou faculdade...">
    <div style="display:flex;gap:6px;margin-bottom:12px"><select style="flex:1;padding:8px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg-primary);color:var(--text-primary)"><option>Qualquer curso</option><option>Computação</option><option>Design</option></select><select style="flex:1;padding:8px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg-primary);color:var(--text-primary)"><option>Qualquer semestre</option><option>5º ao 8º</option><option>Formado</option></select></div>
    ${CANDS.map((cd,i)=>`<div class="card"><div style="display:flex;align-items:flex-start;gap:10px;cursor:pointer" onclick="abrirCandidato(${i})"><div class="av" style="width:38px;height:38px;font-size:13px;font-weight:700;background:${cd.bg};color:${cd.c}">${cd.ic}</div><div style="flex:1"><div style="font-size:13px;font-weight:600;margin-bottom:2px">${cd.n}</div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">${cd.s}</div><div class="tags">${cd.sk.map(s=>`<span class="tag">${s}</span>`).join('')}</div></div></div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn" style="flex:1;font-size:11px" onclick="abrirCandidato(${i})">Ver perfil</button><button class="btn btnp" style="flex:1;font-size:11px">Convidar</button></div></div>`).join('')}`;
  else if(S.tab==='chatEmp')c=`
    <div class="ptitle">Chat com candidatos</div><div class="psub">Converse diretamente com os talentos</div>
    <div class="card" style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:8px">CONVERSAS ATIVAS</div>
    <div class="divrow row" style="cursor:pointer;background:var(--bl);border-radius:var(--radius-sm);padding:8px"><div style="display:flex;align-items:center;gap:8px;flex:1"><div class="av" style="width:30px;height:30px;font-size:10px;font-weight:700;background:#EEEDFE;color:#3C3489">JS</div><div><div style="font-size:13px;font-weight:600">João Silva</div><div style="font-size:12px;color:var(--text-secondary)">Dev front-end júnior</div></div></div><span class="badge bo">Ativa</span></div>
    <div class="divrow row" style="cursor:pointer;padding:8px"><div style="display:flex;align-items:center;gap:8px;flex:1"><div class="av" style="width:30px;height:30px;font-size:10px;font-weight:700;background:#E1F5EE;color:#085041">MA</div><div><div style="font-size:13px;font-weight:600">Maria Alves</div><div style="font-size:12px;color:var(--text-secondary)">UX Designer Jr.</div></div></div><span class="badge bgy">Lida</span></div></div>
    <div class="card"><div style="font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:10px">CONVERSA COM JOÃO SILVA</div>
    <div class="msg-wrap" style="max-height:200px" id="emp-wrap">${S.empChatMsgs.map(m=>m.eu?`<div style="display:flex;justify-content:flex-end"><div class="msg mu">${m.txt}</div></div>`:`<div class="sala-msg"><div class="sala-av" style="background:${m.bg};color:${m.c}">${m.av}</div><div><div class="sala-name">${m.n}</div><div class="sala-bubble">${m.txt}</div></div></div>`).join('')}</div>
    <div class="ci" style="margin-top:8px"><input id="emp-ci" placeholder="Escreva uma mensagem..." onkeydown="if(event.key==='Enter')enviarEmp()"><button class="btn btnp" onclick="enviarEmp()"><i class="ti ti-send"></i></button></div></div>`;
  else if(S.tab==='notifs'){S.notifs=0;c=`<div class="ptitle">Notificações</div><div class="psub">Atualizações da empresa</div><div class="card">${[['var(--brand)','8 novos candidatos hoje','Dev front-end júnior recebeu aplicações','agora'],['#1D9E75','João aceitou convite','Candidato confirmou interesse','1h'],['#534AB7','Vaga expirando em 2 dias','Analista de dados vence em breve','3h']].map(([c2,t,sub,w])=>`<div class="notif-item"><div class="notif-dot" style="background:${c2}"></div><div style="flex:1"><div style="font-size:13px;font-weight:600">${t}</div><div style="font-size:12px;color:var(--text-secondary)">${sub}</div></div><div style="font-size:11px;color:var(--text-secondary)">${w}</div></div>`).join('')}</div>`;}
  return`${topbar()}<div class="main"><div class="scr">${c}</div></div>${nav}`;}

function escolher(p){S.perfil=p;nav('cadastro');}
function avancar(){if(S.perfil==='estudante')nav('plugin');else{S.tab='dashboard';nav('app','dashboard');}}
function navTab(t){S.tab=t;nav('app',t);}
function abrirVaga(i){S.vagaIdx=i;nav('vagadetalhe');}
function abrirCandidato(i){S.candidatoIdx=i;nav('candidatodetalhe');}
function abrirMateria(id){S.materia=id;S.etabMat='hub';S.simFeitoMat=false;S.simResMatD={};nav('materia');}
function candidatar(i){if(!S.candidaturas.includes(i))S.candidaturas.push(i);render();}
function candidatarD(){const i=S.vagaIdx||0;if(!S.candidaturas.includes(i))S.candidaturas.push(i);render();}
function finPlugin(){S.tab='home';nav('app','home');}
function plugNext(){if(S.plugStep===1){S.plugStep=2;render();iniciarSync();}else{S.plugStep=Math.min(S.plugStep+1,3);render();}}
function gerarSim(){S.simGlobal=true;S.simFeito2=false;S.simRespostas2={};render();}
function corrigirSim2(){const qs=QUESTOES[S.simConfig.materia]||QUESTOES.calc2;let ac=0;const res={};qs.forEach((_,i)=>{const r=document.querySelector(`input[name="sg${i}"]:checked`);const v=r?parseInt(r.value):-1;res[i]=v;if(v===qs[i].correta)ac++;});S.simRespostas2=res;S.simResultado2={acertos:ac,total:qs.length};S.simFeito2=true;S.progresso.simulados++;S.progresso.streak++;render();}
function corrigirMat(){const qs=QUESTOES[S.materia]||QUESTOES.calc2;let ac=0;const d={};qs.forEach((_,i)=>{const r=document.querySelector(`input[name="qm${i}"]:checked`);const v=r?parseInt(r.value):-1;d[i]=v;if(v===qs[i].correta)ac++;});S.simResMatD=d;S.simResMatRes={ac,total:qs.length};S.simFeitoMat=true;S.progresso.simulados++;render();}
function sugerirP(t){const inp=document.getElementById('ci');if(inp){inp.value=`Explica ${t}`;enviarChat();}}
function enviarChat(){const inp=document.getElementById('ci');if(!inp)return;const t=inp.value.trim();if(!t)return;S.chatMsgs.push({ai:false,text:t});inp.value='';const k=Object.keys(IA_R).find(k=>t.toLowerCase().includes(k));const resp=k?IA_R[k]:'Boa pergunta! Me diga a matéria e o tópico específico que vou te ajudar com exemplos práticos.';setTimeout(()=>{S.chatMsgs.push({ai:true,text:resp});render();const w=document.getElementById('chat-wrap');if(w)w.scrollTop=w.scrollHeight;},700);render();}
function enviarSalaM(id){const inp=document.getElementById(`sm-inp-${id}`);if(!inp)return;const t=inp.value.trim();if(!t)return;if(!S.salaMsgs[id])S.salaMsgs[id]=[];S.salaMsgs[id].push({av:'JS',bg:'var(--bl)',c:'var(--brand2)',n:'Você (João)',txt:t});inp.value='';render();const w=document.getElementById(`sm-wrap-${id}`);if(w)w.scrollTop=w.scrollHeight;}
function enviarSalaG(){const inp=document.getElementById('sala-gi');if(!inp)return;const t=inp.value.trim();if(!t)return;const id=S.salaAtiva||'calc2';if(!S.salaMsgs[id])S.salaMsgs[id]=[];S.salaMsgs[id].push({av:'JS',bg:'var(--bl)',c:'var(--brand2)',n:'Você (João)',txt:t});inp.value='';render();const w=document.getElementById(`sala-gw-${id}`);if(w)w.scrollTop=w.scrollHeight;}
function enviarEmp(){const inp=document.getElementById('emp-ci');if(!inp)return;const t=inp.value.trim();if(!t)return;S.empChatMsgs.push({eu:true,txt:t});inp.value='';render();}
function iniciarSync(){const it=[{prog:25,lbl:'Autenticando com UFPR Virtual...',id:'disc',val:'6 disciplinas'},{prog:50,lbl:'Importando calendário...',id:'agenda',val:'14 eventos'},{prog:75,lbl:'Buscando provas e entregas...',id:'provas',val:'4 avaliações'},{prog:100,lbl:'Encontrando colegas...',id:'colegas',val:'38 colegas'}];let i=0;function nx(){if(i>=it.length){setTimeout(()=>{S.plugStep=3;render();},500);return;}const x=it[i];S.syncProg=x.prog;const pf=document.getElementById('pf'),pl=document.getElementById('plbl'),sic=document.getElementById('sic-'+x.id),sv=document.getElementById('sv-'+x.id),sb=document.getElementById('sb-'+x.id);if(pf)pf.style.width=x.prog+'%';if(pl)pl.textContent=x.lbl;if(sic){sic.style.background='#EAF3DE';sic.innerHTML='<i class="ti ti-check" style="font-size:11px;color:#27500A"></i>';}if(sv)sv.textContent=x.val;if(sb){sb.className='badge bg';sb.textContent='OK';}i++;setTimeout(nx,800);}setTimeout(nx,400);}
pushH('login',null);render();
</script>
